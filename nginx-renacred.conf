# Configuração Nginx / OpenResty para a API Renacred (api.renacred.com.br)
# Local no VPS: /etc/icontainer/apps/openresty/openresty/conf/conf.d/api.renacred.com.br.conf

server {
    listen 80;
    listen 443 ssl;
    server_name api.renacred.com.br;

    ssl_certificate /www/sites/vps10149.panel.icontainer.run/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/vps10149.panel.icontainer.run/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        # Tratamento Imediato de Preflight CORS para Navegadores e Frontend
        if ($request_method = "OPTIONS") {
            add_header "Access-Control-Allow-Origin" $http_origin always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header "Access-Control-Allow-Headers" "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-api-key" always;
            add_header "Access-Control-Max-Age" 1728000;
            add_header "Content-Type" "text/plain; charset=utf-8";
            add_header "Content-Length" 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para consultas imobiliárias e cartorárias
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
