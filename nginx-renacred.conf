# Configuração Nginx para Renacred (renacred.com.br e api.renacred.com.br)
# Local no VPS: /etc/nginx/sites-available/renacred.conf

# 1. API Backend (api.renacred.com.br)
server {
    server_name api.renacred.com.br;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para chamadas da API de cartórios
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Certbot SSL será injetado automaticamente aqui
}

# 2. Frontend Web App (renacred.com.br)
server {
    server_name renacred.com.br www.renacred.com.br;

    root /var/www/renacred/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Certbot SSL será injetado automaticamente aqui
}
